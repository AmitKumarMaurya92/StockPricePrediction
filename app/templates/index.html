<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Prediction App</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2338bdf8' stroke-width='2'><path d='M3 3v18h18'/><path d='m19 9-5 5-4-4-3 3'/></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
    <nav>
        <div class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
            Stock Price Prediction
        </div>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle Theme">
            <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
        </button>
    </nav>

    <div class="container-fluid px-md-3">
        <div class="hero text-center mt-5">
            <h1>Market Oracle 🔮</h1>
            <p class="text-secondary">AI-Powered Equity Forecasting &amp; Analysis</p>
        
        <form id="predict-form">
            <div class="market-selector-wrapper" style="margin-bottom: 15px; display: flex; justify-content: center;">
                <select id="market" style="width: 100%; max-width: 300px;">
                    <option value="IN" selected>Indian Market (₹)</option>
                    <option value="US">US Market ($)</option>
                </select>
            </div>
            <div class="search-box mx-auto mt-4">
                <div class="search-input-wrapper">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                    <input type="text" id="symbol" placeholder="Search Ticker (e.g. TCS)" autocomplete="off">
                </div>
                <div id="autocomplete-list" class="autocomplete-items hidden"></div>
                <button type="submit" id="predict-btn" class="predict-btn-main w-100">Generate Prediction</button>
            </div>
            
            <div style="margin-top: 15px; color: var(--text-secondary); display: flex; align-items: center; justify-content: center; gap: 10px;">
                <span>OR</span>
                <label for="csv-upload" id="csv-upload-label" class="upload-btn">
                    <svg width="16" height="16" style="vertical-align: middle; margin-right: 5px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    Upload CSV/Excel Dataset
                </label>
                <input type="file" id="csv-upload" accept=".csv, .xlsx, .xls" class="hidden">
            </div>
        </form>
    </div>

    <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p>Analyzing Neural Network Tensors...</p>
    </div>
    <div id="error-message" class="error hidden" style="margin-top:20px; color:#ef4444;"></div>

        <!-- ═══════════════════════════════════════════════════════════
             DASHBOARD AREA — 3-Row Stacked Layout
             Row 1: Details Card  (full width)
             Row 2: Chart         (full width)
             Row 3: AI HUD + Company Profile (50/50, stacks on mobile)
             ═══════════════════════════════════════════════════════════ -->
        <div class="dashboard-area hidden mt-4" id="result">

            <!-- ── DELETED CARD HIDDEN DATA STORES (Prevents script.js crashes) ── -->
            <div class="d-none">
                <div id="res-logo"></div>
                <h2 id="res-symbol"></h2>
                <div id="res-company-name"></div>
                <a id="res-website"></a>
                <h2 id="res-current-price"></h2>
                <span id="res-change"></span>
                <span id="val-market-cap"></span>
                <span id="val-pe"></span>
                <span id="val-roce"></span>
                <span id="val-book-value"></span>
                <span id="val-current-price"></span>
                <span id="val-high-low"></span>
                <span id="val-roe"></span>
                <span id="val-dividend"></span>
                <span id="val-face-value"></span>
            </div>

            <!-- ── Row 2 : Full-width Chart ── -->
            <div class="row g-4 mt-1">
                <div class="col-12">
                    <div class="chart-card">
                        <div class="chart-header d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center mb-4 gap-3">
                            <div id="timeframe-buttons">
                                <button id="btn-1d"  class="interval-btn" data-period="1D">1D</button>
                                <button id="btn-1w"  class="interval-btn" data-period="1W">1W</button>
                                <button id="btn-1m"  class="interval-btn" data-period="1M">1M</button>
                                <button id="btn-6m"  class="interval-btn" data-period="6M">6M</button>
                                <button id="btn-1y"  class="interval-btn active" data-period="1Y">1Y</button>
                                <button id="btn-5y"  class="interval-btn" data-period="5Y">5Y</button>
                                <button id="btn-max" class="interval-btn" data-period="MAX">MAX</button>
                            </div>
                            <select id="chart-type" class="form-select form-select-sm" style="width: auto;">
                                <option value="line" selected>Line Chart</option>
                                <option value="candlestick">Candlestick</option>
                                <option value="bar">Bar Chart</option>
                            </select>
                        </div>

                        <div id="chart-container"></div>

                        <div class="chart-footer d-flex flex-wrap justify-content-center gap-3 mt-3">
                            <label><input type="checkbox" id="toggle-price"   checked> Price</label>
                            <label><input type="checkbox" id="toggle-dma50"   checked> 50 DMA</label>
                            <label><input type="checkbox" id="toggle-dma200"  checked> 200 DMA</label>
                            <label><input type="checkbox" id="toggle-volume"  checked> Volume</label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ── Row 3 : AI Intel HUD  +  Company Profile ── -->
            <div class="row g-4 mt-1">
                <!-- AI Projection Card -->
                <div class="col-12 col-md-6">
                    <div id="ai-intel-hud" class="ai-intel-hud h-100">
                        <div class="hud-header d-flex justify-content-between align-items-center mb-3">
                            <span class="hud-label">AI Prediction</span>
                            <span id="res-recommendation-pill" class="badge signal-badge">HOLD SIGNAL</span>
                        </div>
                        <div class="hud-main-display mb-4">
                            <span class="hud-sublabel">FORECAST TARGET</span>
                            <h1 id="res-predicted-price" class="forecast-price mb-0">₹0.00</h1>
                        </div>
                        <div class="hud-footer row g-2">
                            <div class="col-6">
                                <div class="hud-sublabel">PROFIT GOAL</div>
                                <div id="target-price" class="fw-bold text-success">₹ 0</div>
                            </div>
                            <div class="col-6 text-end">
                                <div class="hud-sublabel">STOP LOSS</div>
                                <div id="stop-loss" class="fw-bold text-danger">₹ 0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Company Intelligence Card -->
                <div class="col-12 col-md-6">
                    <div class="profile-card h-100">
                        <h6 class="text-uppercase small mb-3 opacity-75 fw-bold" style="letter-spacing: 1px;">Company Intelligence</h6>
                        <div class="about-text-container clamped small" id="about-container">
                            <p id="res-about-text">Loading...</p>
                        </div>
                        <button id="read-more-btn" class="btn btn-link btn-sm p-0 text-decoration-none mt-2 hidden">READ MORE ></button>
                    </div>
                </div>
            </div>

        </div><!-- /dashboard-area -->
    </div><!-- /container-fluid -->

    <footer style="margin-top: auto; padding-top: 50px; padding-bottom: 30px; text-align: center; color: var(--text-secondary); font-size: 0.9rem; font-weight: 600; width: 100%;">
        Amit 🖤
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
